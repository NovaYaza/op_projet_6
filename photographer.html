<!DOCTYPE html>
<html lang="fr">
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Fisheye - photographe </title>
  </head>
  <body>
    <header>
      <a href="index.html"><img src="assets/images/logo.png" class="logo" alt="Fisheye Home page"/></a>
    </header>
    <main id="main" aria-hidden="false">
      <div class="photograph-header">
        <div class="photographer_info"></div>
        <button class="contact_button" onclick="displayModal()" aria-label="Contact Me">Contactez-moi</button>
        <div class="photographer_imgprofil"></div>
      </div>
      <div class="div_menu_tri">
        <form class="form_menu_tri">
          <label class="label_menu_tri" for="menu_tri">
            Trier par
          </label>
          <select class="select_menu_tri" id="menu_tri" name="menu_tri">
            <option value="popularite" selected>Popularité</option>
            <option value="date">Date</option>
            <option value="titre">Titre</option>
        </select>
      </form>
      </div>
      <div class="photographer_media" id="lightbox_likes"></div>
      <div class="photographer_encart"></div>
    </main>
    <div id="contact_modal" aria-hidden="true" role="dialog" aria-describedby="modalContactPhotographer">
			<div class="modal">
				<header class="header_modal">
          <div class="div_header_modal">
            <h2 id="modalContactPhotographer">Contactez-moi</h2>
            <img id="img_closeModal" tabindex="0" aria-label="Close Contact form" alt="croix" src="assets/icons/close.svg" onclick="closeModal()" />
          </div>
          <div class="name_photographer_modal"></div>
        </header>
				<form id="form_contact" novalidate>
					<div class="div_form">
						<label for="firstname">Prénom</label>
						<input
            aria-required="true"
            class="text-control"
            type="text"
            id="firstname"
            name="first"/>
            <div class="formData"></div>
            <label for="lastname">Nom</label>
						<input
            aria-required="true"
            class="text-control"
            type="text"
            id="lastname"
            name="last"/>
            <div class="formData"></div>
            <label for="email">Email</label>
						<input
            aria-required="true"
            class="text-control"
            type="email"
            id="email"
            name="email"/>
            <div class="formData"></div>
            <label for="message_personnalise">Votre message</label>
						<textarea aria-required="true" class="text-area" id="message_personnalise" name="message_personnalisé"></textarea>
            <div class="formData"></div>
					</div>
          <button aria-label="Send" type="submit" class="contact_button">Envoyer</button>
				</form>
			</div>
		</div>
    <div id="lightbox" aria-hidden="true" style="display:none;" aria-label="image closeup view">
      <span id="close_lightbox" aria-label="Close dialog" tabindex="0"><em class="fa-solid fa-xmark"></em></span>
      <button id="lightbox-prev" aria-label="Previous image"><em class="fa-solid fa-chevron-left"></em></button>
      <div class="medias-content">
        <div id="lightbox-content"></div>
        <div id="lightbox-image-infos"></div>
      </div>
      <button id="lightbox-next" aria-label="Next image"><em class="fa-solid fa-chevron-right"></em></button>
    </div>
    <script type="module" src="/scripts/pages/photographer.js"></script>
    <script type="module" src="/scripts/factories/mediaFactory.js"></script>
    <script type="module" src="/scripts/factories/media.js"></script>
    <script src="/scripts/utils/contactForm.js"></script>
    <script src="/scripts/utils/lightbox.js"></script>
  </body>
</html>
